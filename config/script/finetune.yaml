output_dir: ./output
model_config_path: null

dataset:
  class: JointDataset
  # the dataset(s) to finetune on
  graphs: [CoDExMedium]
  root: ./kg-datasets/

model:
  class: KGPFN
  # The model section must match kgpfn_checkpoint: weights are loaded with strict=False,
  # so mismatched modules are silently left at their initialization.
  # Set to "none" / "null" to disable structure encoder, use semantic encoder only
  structure_encoder: True
  enhance_structure: True
  structure_score_enhance: True  # Whether to use ULTRA MLP score as additional feature
  with_relation: True            # Whether to concatenate relation to entity embedding (True=128d, False=64d structure-only)
  context_graph: 3             # 0=disabled; k>0: prepend k-hop head embeddings from EntityNBFNet layers
  context_tail: True            # if true, also prepend k-hop tail embeddings in head subgraph
  seq_chunk_size: 40  # Chunk size for sequence dimension to avoid [B,S,num_nodes,D] OOM; null for no chunking
  feature_transformer: tabicl  # limix | tabpfn | tabicl
  relation_model:
    class: RelNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
  entity_model:
    class: EntityNBFNet
    input_dim: 64
    entity_chunk_size: 64  # Chunk size for entity computation to avoid OOM; null for no chunking
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
  semantic_encoder:
    model_name: none # none, all-MiniLM-L12-v2, local path
    dim: 384

task:
  name: MultiGraphPretraining
  num_negative: 256
  strict_negative: yes
  adversarial_temperature: 1.0
  metric: [mr, mrr, hits@1, hits@3, hits@10]
  num_pos: 20
  num_neg: 80
  # loss_weights: [lambda_bce, lambda_softmax]
  # [1.0, 0.0] = pure BCE, [0.0, 1.0] = pure softmax, [1.0, 1.0] = both
  loss_weights: [1.0, 1.0]
  # label_smoothing: only used for softmax loss; 0.0 = no smoothing
  label_smoothing: 0.1
  # also train each triple as a (t, r^-1, ?) query; doubles the effective batch size
  train_inverse: yes
  # full-graph batches drop their B positives and B inverse edges from the observed graph
  # (forced on when train.finetune_mode is full)
  mask_query_edges: True
  # [tail, head]: average each side first, then combine by these weights
  side_loss_weights: [1.0, 1.0]
  context_label_correction: True
  # Online support/query split used by stage 2 when train.finetune_mode is episode
  # (`enabled` is overridden by finetune_mode). See config/script/train_all.yaml.
  episode:
    enabled: true
    rho: [0.8, 0.9]
    rho_jitter: 0.08
    steps_per_episode: 10
    max_retries: 8
    resample_retries: 3

optimizer:
  class: AdamW
  lr: 5.0e-5                      # default lr; each stage can override it (structure_encoder_lr / pfn_lr)
  weight_decay: 1.0e-6            # none / null: disable weight_decay (converted to 0.0 in script)
train:
  # train params
  gpus: {{ gpus }}
  batch_size: 32
  num_epoch: 0                    # unused by the two-stage schedule below
  log_interval: 25
  batch_per_epoch: 100
  valid_eval_step_interval: 100   # evaluate on valid (and refresh model_best.pth) every N steps; 0 = never

  # ── Stage 1: train only the structure encoder (adapters + PFN frozen) ──
  # Uses ULTRA's own link-prediction loss on the 1+num_negative candidates instead of
  # backpropagating through the frozen PFN, which would keep a [num_nodes, D] activation
  # per context (h, r) pair and never train the ULTRA MLP score head. Always trains on
  # the full train graph; EntityNBFNet drops each batch's query edges itself in training
  # mode. Single-process only (set structure_encoder_epoch: 0 for multi-GPU runs).
  structure_encoder_epoch: 5
  structure_encoder_lr: 1.0e-5    # null: use optimizer.lr
  # null = one full pass over the train set per epoch; otherwise this many random batches.
  # Falls back to batch_per_epoch when omitted.
  structure_encoder_batch_per_epoch: 100

  # ── Stage 2: freeze the structure encoder, train adapters + PFN ──
  pfn_epoch: 20
  pfn_lr: 5.0e-5                  # null: use optimizer.lr
  #   episode = online support/query splits with the ratios in task.episode
  #   full    = whole train graph, mask_query_edges removes each batch's edges
  finetune_mode: full             # episode | full

  # eval params
  # subsample of the official test split for the final test eval; checkpointing uses full valid
  fast_test: 256
  eval_chunk_size: 128
  skip_final_test: false          # true: skip evaluating model_best.pth on the test split

  # log params (defaults to working_dir/finetune.log when log_file is not configured)
  max_checkpoints: 10  # Max number of step checkpoints to keep (model_best is always kept)
  checkpoint_dir: ./checkpoints/
  inverse_relation_semantic_mode: text

  # init model paths
  init_model: true
  structure_encoder_path: ./cache/structure_encoder.pth
  limix_repo_id: stableai-org/LimiX-16M
  limix_filename: LimiX-16M.ckpt
  limix_cache_dir: ./cache
  limix_config_path: ./config/limix/limix_config.yaml

  tabicl_config_path: ./config/tabicl/tabicl.yaml
  tabicl_ckpt_path: ./cache/tabicl-regressor-v2-20260212.ckpt  # or classifier ckpt

  # pretrained KGPFN to finetune (highest priority, overrides the init above),
  # e.g. ./cache/kgpfn_icl.pth from `python script/download.py --kgpfn`
  kgpfn_checkpoint: null

  # wandb logging
  use_wandb: false  # Set to false to disable wandb
  wandb_api_key: <your wandb api key>
  wandb_project: kgpfn-finetune
