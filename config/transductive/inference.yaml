output_dir: /data/gaoyisen/ultrapfn2/output

dataset:
  class: {{ dataset }}
  root: /data/gaoyisen/ultrapfn2/kg-datasets/

model:
  class: Ultra
  enhance_structure: False
  seq_chunk_size: 4  # 序列维度分块，避免 [B,S,num_nodes,D] OOM；null 则不分块
  relation_model:
    class: RelNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
  entity_model:
    class: EntityNBFNet
    input_dim: 64
    entity_chunk_size: 8  # 分块计算 entity 表示，避免 OOM；null 则不分块
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
  semantic_encoder:
    model_name: all-MiniLM-L12-v2 # none, all-MiniLM-L12-v2, local path
    dim: 384

task:
  name: TransductiveInference
  num_negative: 64
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10]
  num_hops: 1
  num_pos: 40
  num_neg: 40

optimizer:
  class: AdamW
  lr: 5.0e-4

train:
  gpus: {{ gpus }}
  batch_size: 4
  num_epoch: {{ epochs }}
  log_interval: 1
  batch_per_epoch: {{ bpe }}

  # inverse relation semantic mode:
  # - "text": use natural-language reverse description text
  # - "negate": use base relation text, then relation semantic embedding *= -1
  inverse_relation_semantic_mode: "negate" # "negate" and "text" are supported
  # whether to train structure encoder parameters
  train_structure_encoder: true
  # optional full KGPFN checkpoint (new pipeline)
  kgpfn_checkpoint: null
  init_model: True

checkpoint: null